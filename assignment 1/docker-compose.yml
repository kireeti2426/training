version: '3.8'

services:
  mongo:
    image: mongo:7.0
    container_name: insecure-webapp-mongo
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_DATABASE: insecure-webapp
    volumes:
      - mongo_data:/data/db
    networks:
      - insecure-webapp-network

  web:
    build: .
    container_name: insecure-webapp-server
    ports:
      - "3000:3000"
    depends_on:
      - mongo
    environment:
      MONGODB_URI: mongodb://mongo:27017/insecure-webapp
      NODE_ENV: development
    volumes:
      - ./uploads:/app/uploads
    networks:
      - insecure-webapp-network
    command: node server.js

volumes:
  mongo_data:

networks:
  insecure-webapp-network:
    driver: bridge
