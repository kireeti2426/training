<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Insecure WebApp</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <nav class="navbar">
        <div class="nav-container">
            <h1>🔓 Insecure WebApp</h1>
            <div class="nav-menu">
                <a href="/">Home</a>
                <a href="login.html">Login</a>
                <a href="register.html">Register</a>
            </div>
        </div>
    </nav>

    <div class="container">
        <div class="form-container">
            <h2>Login</h2>
            <form id="loginForm">
                <div class="form-group">
                    <label for="username">Username:</label>
                    <input type="text" id="username" name="username" required>
                </div>

                <div class="form-group">
                    <label for="password">Password:</label>
                    <input type="password" id="password" name="password" required>
                </div>

                <button type="submit" class="btn btn-primary">Login</button>
                <p>Don't have an account? <a href="register.html">Register here</a></p>
            </form>
            <div id="message"></div>
        </div>
    </div>

    <footer>
        <p>⚠️ For Educational Purposes Only</p>
    </footer>

    <script>
        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();

            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;

            try {
                const response = await fetch('/login', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ username, password })
                });

                const data = await response.json();
                if (data.success) {
                    // ⚠️ INSECURE: Storing userId and username in localStorage
                    localStorage.setItem('userId', data.userId);
                    localStorage.setItem('username', username);
                    document.getElementById('message').textContent = 'Login successful! Redirecting...';
                    
                    // Fetch user data to get ID
                    const userResponse = await fetch(`/posts`);
                    const posts = await userResponse.json();
                    
                    setTimeout(() => {
                        window.location.href = 'dashboard.html';
                    }, 1000);
                } else {
                    document.getElementById('message').textContent = 'Error: ' + data.message;
                }
            } catch (err) {
                document.getElementById('message').textContent = 'Error: ' + err.message;
            }
        });
    </script>
</body>
</html>
